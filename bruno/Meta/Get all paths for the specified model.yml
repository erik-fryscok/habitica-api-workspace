          disabled: true
        - name: model
          value: todo
          type: path
          description: The name of the model
          disabled: true
        - name: model
          value: reward
          type: path
          description: The name of the model
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
