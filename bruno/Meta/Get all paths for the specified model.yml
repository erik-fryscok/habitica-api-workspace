info:
  name: Get all paths for the specified model
  type: http
  seq: 1
  tags:
    - Meta

http:
  method: GET
  url: "{{baseUrl}}/api/v3/models/:model/paths"
  params:
    - name: model
      value: user
      type: path
      description: The name of the model
    - name: model
      value: group
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: challenge
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: tag
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: habit
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: daily
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: todo
      type: path
      description: The name of the model
      disabled: true
    - name: model
      value: reward
      type: path
      description: The name of the model
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

