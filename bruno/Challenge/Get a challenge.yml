info:
  name: Get a challenge
  type: http
  seq: 5
  tags:
    - Challenge

http:
  method: GET
  url: "{{baseUrl}}/api/v3/challenges/:challengeId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The challenge _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/challenges/:challengeId"
      method: GET
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "group": {
               "_id": "group-id-associated-with-challenge",
               "name": "MyGroup",
               "type": "guild",
               "privacy": "public"
              },
              "name": "Long Detailed Name of Challenge",
              "shortName": "my challenge",
              "leader": {
                "_id": "user-id-of-challenge-creator",
                "profile": {
                  "name": "MyUserName"
                }
              },
              "updatedAt": "timestamp,
              "createdAt": "timestamp",
              "_id": "challenge-id",
              "prize": 0,
              "memberCount": 1,
              "tasksOrder": {
                "rewards": [
                  "uuid-of-challenge-reward"
                ],
                "todos": [
                  "uuid-of-challenge-todo"
                ],
                "dailys": [
                  "uuid-of-challenge-daily"
                ],
                "habits": [
                  "uuid-of-challenge-habit"
                ]
              },
              "official": false,
              "id": "challenge-id"
            }
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/challenges/:challengeId"
      method: GET
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ChallengeNotFound": {}
          }
