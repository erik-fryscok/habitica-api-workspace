info:
  name: Leave a challenge
  type: http
  seq: 12
  tags:
    - Challenge

http:
  method: POST
  url: "{{baseUrl}}/api/v3/challenges/:challengeId/leave"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The challenge _id
  body:
    type: json
    data: |-
      {
        "keep": "remove-all"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/challenges/:challengeId/leave"
      method: POST
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
      body:
        type: json
        data: |-
          {
            "keep": "remove-all"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 404 Response
