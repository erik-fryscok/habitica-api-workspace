info:
  name: Create a new challenge
  type: http
  seq: 3
  tags:
    - Challenge

http:
  method: POST
  url: "{{baseUrl}}/api/v3/challenges"
  body:
    type: json
    data: |-
      {
        "challenge": {},
        "challenge.group": "",
        "challenge.name": "",
        "challenge.shortName": "",
        "challenge.summary": "",
        "challenge.description": "",
        "official": false,
        "challenge.prize": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/challenges"
      method: POST
      body:
        type: json
        data: |-
          {
            "challenge": {},
            "challenge.group": "",
            "challenge.name": "",
            "challenge.shortName": "",
            "challenge.summary": "",
            "challenge.description": "",
            "official": false,
            "challenge.prize": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "group": {
               "_id": "group-id-associated-with-challenge",
               "name": "MyGroup",
               "type": "guild",
               "privacy": "public"
              },
              "name": "Long Detailed Name of Challenge",
              "shortName": "my challenge",
              "leader": {
                "_id": "user-id-of-challenge-creator",
                "profile": {
                  "name": "MyUserName"
                }
              },
              "updatedAt": "timestamp,
              "createdAt": "timestamp",
              "_id": "challenge-id",
              "prize": 0,
              "memberCount": 1,
              "tasksOrder": {
                "rewards": [
                  "uuid-of-challenge-reward"
                ],
                "todos": [
                  "uuid-of-challenge-todo"
                ],
                "dailys": [
                  "uuid-of-challenge-daily"
                ],
                "habits": [
                  "uuid-of-challenge-habit"
                ]
              },
              "official": false,
              "id": "challenge-id"
            }
          }
  - name: 201 Response
    description: "201"
    request:
      url: "{{baseUrl}}/api/v3/challenges"
      method: POST
      body:
        type: json
        data: |-
          {
            "challenge": {},
            "challenge.group": "",
            "challenge.name": "",
            "challenge.shortName": "",
            "challenge.summary": "",
            "challenge.description": "",
            "official": false,
            "challenge.prize": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "challenge": {}
          }
  - name: 400 Response
