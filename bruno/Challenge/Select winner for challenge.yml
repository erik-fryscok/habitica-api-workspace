info:
  name: Select winner for challenge
  type: http
  seq: 13
  tags:
    - Challenge

http:
  method: POST
  url: "{{baseUrl}}/api/v3/challenges/:challengeId/selectWinner/:winnerId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The _id for the challenge to close with a winner
    - name: winnerId
      value: ""
      type: path
      description: The _id of the winning user
  auth: inherit

settings:
