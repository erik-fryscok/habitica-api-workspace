info:
  name: Export a challenge in CSV
  type: http
  seq: 7
  tags:
    - Challenge

http:
  method: GET
  url: "{{baseUrl}}/api/v3/challenges/:challengeId/export/csv"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The challenge _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/challenges/:challengeId/export/csv"
      method: GET
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "challenge": ""
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/challenges/:challengeId/export/csv"
      method: GET
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ChallengeNotFound": {}
          }
