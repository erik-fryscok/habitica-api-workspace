info:
  name: Get Habitica's Server readiness status
  type: http
  seq: 1
  tags:
    - Status

http:
  method: GET
  url: "{{baseUrl}}/api/v3/ready"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/ready"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ready"
          }
