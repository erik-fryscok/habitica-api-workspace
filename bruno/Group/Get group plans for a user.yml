info:
  name: Get group plans for a user
  type: http
  seq: 7
  tags:
    - Group

http:
  method: GET
  url: "{{baseUrl}}/api/v3/group-plans"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/group-plans"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          HTTP/1.1 200 OK
          [
            {groupPlans}
          ]
