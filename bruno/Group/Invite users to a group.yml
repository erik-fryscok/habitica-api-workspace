info:
  name: Invite users to a group
  type: http
  seq: 9
  tags:
    - Group

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/invite"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
  body:
    type: json
    data: |-
      {
        "emails": [
          {}
        ],
        "emails.email": "",
        "emails.name": "",
        "uuids": [
          {}
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

