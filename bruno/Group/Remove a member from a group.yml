info:
  name: Remove a member from a group
  type: http
  seq: 14
  tags:
    - Group

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/removeMember/:memberId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
    - name: memberId
      value: ""
      type: path
      description: The _id of the member to remove
    - name: message
      value: ""
      type: query
      description: Query parameter - The message to send to the removed members
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

