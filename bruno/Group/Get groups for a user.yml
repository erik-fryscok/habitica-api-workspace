info:
  name: Get groups for a user
  type: http
  seq: 3
  tags:
    - Group

http:
  method: GET
  url: "{{baseUrl}}/api/v3/groups"
  params:
    - name: type
      value: ""
      type: query
      description: The type of groups to retrieve. Must be a query string representing a list of values like 'tavern,party'. Possible values are party, guilds, privateGuilds, publicGuilds, tavern.
    - name: paginate
      value: "true"
      type: query
      description: Public guilds support pagination. When true guilds are returned in groups of 30.
      disabled: true
    - name: paginate
      value: "false"
      type: query
      description: Public guilds support pagination. When true guilds are returned in groups of 30.
      disabled: true
    - name: page
      value: ""
      type: query
      description: When pagination is enabled for public guilds this parameter can be used to specify the page number (the initial page is number 0 and not required).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups"
      method: GET
      params:
        - name: type
          value: ""
          type: query
          description: The type of groups to retrieve. Must be a query string representing a list of values like 'tavern,party'. Possible values are party, guilds, privateGuilds, publicGuilds, tavern.
        - name: paginate
          value: "true"
          type: query
          description: Public guilds support pagination. When true guilds are returned in groups of 30.
          disabled: true
        - name: paginate
          value: "false"
          type: query
          description: Public guilds support pagination. When true guilds are returned in groups of 30.
          disabled: true
        - name: page
          value: ""
          type: query
          description: When pagination is enabled for public guilds this parameter can be used to specify the page number (the initial page is number 0 and not required).
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          HTTP/1.1 200 OK
          [
            {guilds}
          ]
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/groups"
      method: GET
      params:
        - name: type
          value: ""
          type: query
          description: The type of groups to retrieve. Must be a query string representing a list of values like 'tavern,party'. Possible values are party, guilds, privateGuilds, publicGuilds, tavern.
        - name: paginate
          value: "true"
          type: query
          description: Public guilds support pagination. When true guilds are returned in groups of 30.
          disabled: true
        - name: paginate
          value: "false"
          type: query
          description: Public guilds support pagination. When true guilds are returned in groups of 30.
          disabled: true
        - name: page
          value: ""
          type: query
          description: When pagination is enabled for public guilds this parameter can be used to specify the page number (the initial page is number 0 and not required).
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "groupTypesRequired": {},
            "guildsPaginateBooleanString": {},
