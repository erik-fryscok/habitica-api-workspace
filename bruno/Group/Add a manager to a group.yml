info:
  name: Add a manager to a group
  type: http
  seq: 1
  tags:
    - Group

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/add-manager"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
  body:
    type: json
    data: |-
      {
        "managerId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/add-manager"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
      body:
        type: json
        data: |-
          {
            "managerId": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 400 Response
