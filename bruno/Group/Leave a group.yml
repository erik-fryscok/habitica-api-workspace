info:
  name: Leave a group
  type: http
  seq: 11
  tags:
    - Group

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/leave"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
    - name: keep
      value: remove-all
      type: query
      description: Whether or not to keep challenge tasks belonging to the group being left.
    - name: keep
      value: keep-all
      type: query
      description: Whether or not to keep challenge tasks belonging to the group being left.
      disabled: true
  body:
    type: json
    data: |-
      {
        "keepChallenges": "remain-in-challenges"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

