info:
  name: Get group
  type: http
  seq: 5
  tags:
    - Group

http:
  method: GET
  url: "{{baseUrl}}/api/v3/groups/:groupId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId"
      method: GET
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          HTTP/1.1 200 OK
          {
            "name": "Tavern",
            ...
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId"
      method: GET
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "groupIdRequired": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId"
      method: GET
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "GroupNotFound": {}
          }
