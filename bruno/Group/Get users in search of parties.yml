info:
  name: Get users in search of parties
  type: http
  seq: 8
  tags:
    - Group

http:
  method: GET
  url: "{{baseUrl}}/api/v3/looking-for-party"
  params:
    - name: page
      value: ""
      type: query
      description: Page number, defaults to 0
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
