      params:
        - name: page
          value: ""
          type: query
          description: Page number, defaults to 0
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {}
            ]
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/looking-for-party"
