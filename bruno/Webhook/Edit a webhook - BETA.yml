info:
  name: Edit a webhook - BETA
  type: http
  seq: 4
  tags:
    - Webhook

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/user/webhook/:id"
  params:
    - name: id
      value: ""
      type: path
      description: URL parameter - The id of the webhook to update
  body:
    type: json
    data: |-
      {
        "url": "",
        "label": "",
        "enabled": false,
        "type": "taskActivity",
        "options": {}
      }
  auth: inherit

settings:
