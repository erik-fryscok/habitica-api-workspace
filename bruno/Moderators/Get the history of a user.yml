info:
  name: Get the history of a user
  type: http
  seq: 1
  tags:
    - Moderators

http:
  method: GET
  url: "{{baseUrl}}/api/v4/admin/user/:userId/history"
  params:
    - name: userId
      value: ""
      type: path
      description: The username or email of the user
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v4/admin/user/:userId/history"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: The username or email of the user
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 401 Response
    description: "401"
    request:
      url: "{{baseUrl}}/api/v4/admin/user/:userId/history"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: The username or email of the user
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoAuthHeaders": {},
            "NoAccount": {},
            "NotAdmin": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v4/admin/user/:userId/history"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: The username or email of the user
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoUser": {}
          }
