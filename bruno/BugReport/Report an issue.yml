info:
  name: Report an issue
  type: http
  seq: 1
  tags:
    - BugReport

http:
  method: POST
  url: "{{baseUrl}}/api/v4/bug-report"
  body:
    type: json
    data: |-
      {
        "message": "",
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v4/bug-report"
      method: POST
      body:
        type: json
        data: |-
          {
            "message": "",
            "email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {},
            "data.ok": false,
            "data.message": ""
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v4/bug-report"
      method: POST
      body:
        type: json
        data: |-
          {
            "message": "",
            "email": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "emptyReportBugMessage": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v4/bug-report"
      method: POST
      body:
        type: json
        data: |-
          {
            "message": "",
            "email": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "UserNotFound": {}
          }
