info:
  name: Flag (report) a user
  type: http
  seq: 2
  tags:
    - Members

http:
  method: POST
  url: "{{baseUrl}}/api/v3/members/:memberId/flag"
  params:
    - name: memberId
      value: ""
      type: path
      description: The unique ID of the user being flagged
  body:
    type: json
    data: |-
      {
        "comment": "",
        "source": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/flag"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the user being flagged
      body:
        type: json
        data: |-
          {
            "comment": "",
            "source": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {},
            "data.id": "",
            "data.username": "",
            "data.profile": {},
            "data.profile.blurb": "",
            "data.profile.flags": {},
            "data.profile.imageUrl": "",
            "data.profile.name": ""
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/flag"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the user being flagged
      body:
        type: json
        data: |-
          {
            "comment": "",
            "source": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "AlreadyFlagged": {},
            "MemberIdRequired": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/flag"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the user being flagged
      body:
        type: json
        data: |-
          {
            "comment": "",
            "source": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "UserWithIdNotFound": {}
          }
