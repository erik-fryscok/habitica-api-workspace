info:
  name: Delete flags from a user
  type: http
  seq: 1
  tags:
    - Members

http:
  method: POST
  url: "{{baseUrl}}/api/v3/members/:memberId/clear-flags"
  params:
    - name: memberId
      value: ""
      type: path
      description: The unique ID of the flagged user to reset
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/clear-flags"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the flagged user to reset
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/clear-flags"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the flagged user to reset
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "MemberIdRequired": {},
            "MustBeAdmin": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/members/:memberId/clear-flags"
      method: POST
      params:
        - name: memberId
          value: ""
          type: path
          description: The unique ID of the flagged user to reset
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "UserWithIdNotFound": {}
          }
