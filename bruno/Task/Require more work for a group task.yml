info:
  name: Require more work for a group task
  type: http
  seq: 21
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/needs-work/:userId"
  params:
    - name: taskId
      value: ""
      type: path
      description: The id of the task that is the original group task
    - name: userId
      value: ""
      type: path
      description: The id of the assigned user
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/needs-work/:userId"
      method: POST
      params:
        - name: taskId
          value: ""
          type: path
          description: The id of the task that is the original group task
        - name: userId
          value: ""
          type: path
          description: The id of the assigned user
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "task": ""
          }
