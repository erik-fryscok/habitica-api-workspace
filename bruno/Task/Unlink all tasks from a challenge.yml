info:
  name: Unlink all tasks from a challenge
  type: http
  seq: 23
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/unlink-all/:challengeId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The challenge _id
    - name: keep
      value: "'keep-all'"
      type: query
      description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
    - name: keep
      value: "'remove-all'"
      type: query
      description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/unlink-all/:challengeId"
      method: POST
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
        - name: keep
          value: "'keep-all'"
          type: query
          description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
        - name: keep
          value: "'remove-all'"
          type: query
          description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {},
            "notifications": []
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/tasks/unlink-all/:challengeId"
      method: POST
      params:
        - name: challengeId
          value: ""
          type: path
          description: The challenge _id
        - name: keep
          value: "'keep-all'"
          type: query
          description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
        - name: keep
          value: "'remove-all'"
          type: query
          description: Specifies if tasks should be kept(keep-all) or removed(remove-all) after the unlink.
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Broken": {}
          }
