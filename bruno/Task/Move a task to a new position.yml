info:
  name: Move a task to a new position
  type: http
  seq: 16
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/move/to/:position"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
    - name: position
      value: ""
      type: path
      description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/move/to/:position"
      method: POST
      params:
        - name: taskId
          value: ""
          type: path
          description: The task _id or alias
        - name: position
          value: ""
          type: path
          description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              "8d7e237a-b259-46ee-b431-33621256bb0b",
              "2b774d70-ec8b-41c1-8967-eb6b13d962ba",
              "f03d4a2b-9c36-4f33-9b5f-bae0aed23a49"
            ],
            "notifications": []
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/move/to/:position"
      method: POST
      params:
        - name: taskId
          value: ""
          type: path
          description: The task _id or alias
        - name: position
          value: ""
          type: path
          description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "TaskNotFound": {}
          }
