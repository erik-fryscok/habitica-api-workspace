info:
  name: Create a new task belonging to the user
  type: http
  seq: 10
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/user"
  body:
    type: json
    data: |-
      {
        "text": "",
        "type": "habit",
        "tags": [],
        "alias": "",
        "attribute": "str",
        "checklist": [
          {}
        ],
        "collapseChecklist": false,
        "notes": "",
        "date": "",
        "priority": 0.1,
        "reminders": [],
        "frequency": "daily",
        "repeat": "",
