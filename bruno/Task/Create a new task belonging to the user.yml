        "streak": 0,
        "daysOfMonth": [],
        "weeksOfMonth": [],
        "startDate": "",
        "up": false,
        "down": false,
        "value": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

