info:
  name: Create a new task belonging to a challenge
  type: http
  seq: 6
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/challenge/:challengeId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The id of the challenge the new task(s) will belong to
  body:
    type: json
    data: |-
      {
        "text": "",
        "type": "habit",
        "attribute": "str",
        "collapseChecklist": false,
        "notes": "",
        "date": "",
        "priority": 0.1,
