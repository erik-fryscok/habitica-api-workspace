info:
  name: Unlink a challenge task
  type: http
  seq: 24
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/unlink-one/:taskId"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
    - name: keep
      value: "'keep'"
      type: query
      description: Specifies if the task should be kept(keep) or removed(remove).
    - name: keep
      value: "'remove'"
      type: query
      description: Specifies if the task should be kept(keep) or removed(remove).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

