  type: http
  seq: 14
  tags:
    - Task

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/tasks/:taskId"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
  body:
    type: json
    data: |-
      {
        "text": "",
        "attribute": "str",
        "collapseChecklist": false,
        "notes": "",
        "date": "",
        "priority": 0.1,
        "reminders": [],
