info:
  name: Get a challenge's tasks
  type: http
  seq: 7
  tags:
    - Task

http:
  method: GET
  url: "{{baseUrl}}/api/v3/tasks/challenge/:challengeId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The id of the challenge from which to retrieve the tasks
    - name: type
      value: habits
      type: query
      description: Query parameter to return just a type of tasks.
      disabled: true
    - name: type
      value: dailys
      type: query
      description: Query parameter to return just a type of tasks.
      disabled: true
    - name: type
      value: todos
      type: query
      description: Query parameter to return just a type of tasks.
      disabled: true
    - name: type
      value: rewards
      type: query
      description: Query parameter to return just a type of tasks.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

