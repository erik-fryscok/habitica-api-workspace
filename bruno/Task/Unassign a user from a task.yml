info:
  name: Unassign a user from a task
  type: http
  seq: 22
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/unassign/:assignedUserId"
  params:
    - name: taskId
      value: ""
      type: path
      description: The id of the task that is the original group task
    - name: assignedUserId
      value: ""
      type: path
      description: The id of the user that will be unassigned from the task
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

