info:
  name: Add an item to the task's checklist
  type: http
  seq: 1
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/checklist"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
  body:
    type: json
    data: |-
      {
        "text": "",
        "completed": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

