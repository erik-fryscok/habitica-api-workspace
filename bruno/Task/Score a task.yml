info:
  name: Score a task
  type: http
  seq: 20
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/score/:direction"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
    - name: direction
      value: up
      type: path
      description: The direction for scoring the task
    - name: direction
      value: down
      type: path
      description: The direction for scoring the task
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/score/:direction"
