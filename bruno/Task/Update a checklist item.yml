info:
  name: Update a checklist item
  type: http
  seq: 18
  tags:
    - Task

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/tasks/:taskId/checklist/:itemId"
  params:
    - name: taskId
      value: ""
      type: path
      description: The task _id or alias
    - name: itemId
      value: ""
      type: path
      description: The checklist item _id
  body:
    type: json
    data: |-
      {
        "text": "",
        "completed": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/checklist/:itemId"
      method: PUT
      params:
        - name: taskId
          value: ""
          type: path
          description: The task _id or alias
        - name: itemId
          value: ""
          type: path
          description: The checklist item _id
      body:
        type: json
        data: |-
          {
            "text": "",
            "completed": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/checklist/:itemId"
