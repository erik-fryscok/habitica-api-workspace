info:
  name: Assign a group task to a user or users
  type: http
  seq: 4
  tags:
    - Task

http:
  method: POST
  url: "{{baseUrl}}/api/v3/tasks/:taskId/assign"
  params:
    - name: taskId
      value: ""
      type: path
      description: The id of the task that will be assigned
  body:
    type: json
    data: |-
      {
        "assignedUserIds": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tasks/:taskId/assign"
      method: POST
      params:
        - name: taskId
          value: ""
          type: path
          description: The id of the task that will be assigned
      body:
        type: json
        data: |-
          {
            "assignedUserIds": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": ""
          }
