info:
  name: Invite users to a quest
  type: http
  seq: 5
  tags:
    - Quest

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/quests/invite/:questKey"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id (or 'party')
    - name: questKey
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/quests/invite/:questKey"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id (or 'party')
        - name: questKey
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/quests/invite/:questKey"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id (or 'party')
        - name: questKey
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "GroupNotFound": {},
            "QuestNotFound": {}
          }
