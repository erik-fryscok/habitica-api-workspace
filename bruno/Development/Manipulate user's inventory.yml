info:
  name: Manipulate user's inventory
  type: http
  seq: 4
  tags:
    - Development

http:
  method: POST
  url: "{{baseUrl}}/api/v3/debug/modify-inventory"
  body:
    type: json
    data: |-
      {
        "gear": {},
        "special": {},
        "pets": {},
        "mounts": {},
        "eggs": {},
        "hatchingPotions": {},
        "food": {},
        "quests": {}
      }
