info:
  name: Allocate a single Stat Point (previously called Attribute Point)
  type: http
  seq: 10
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/allocate"
  params:
    - name: stat
      value: str
      type: query
      description: The Stat to increase. Default is 'str'
    - name: stat
      value: con
      type: query
      description: The Stat to increase. Default is 'str'
      disabled: true
    - name: stat
      value: int
      type: query
      description: The Stat to increase. Default is 'str'
      disabled: true
    - name: stat
      value: per
      type: query
      description: The Stat to increase. Default is 'str'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/allocate"
      method: POST
      params:
        - name: stat
          value: str
          type: query
          description: The Stat to increase. Default is 'str'
        - name: stat
          value: con
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
        - name: stat
          value: int
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
        - name: stat
          value: per
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/allocate"
      method: POST
      params:
        - name: stat
          value: str
          type: query
          description: The Stat to increase. Default is 'str'
        - name: stat
          value: con
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
        - name: stat
          value: int
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
        - name: stat
          value: per
          type: query
          description: The Stat to increase. Default is 'str'
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoPoints": {}
          }
