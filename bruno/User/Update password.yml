info:
  name: Update password
  type: http
  seq: 8
  tags:
    - User

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/user/auth/update-password"
  body:
    type: json
    data: |-
      {
        "password": "",
        "newPassword": "",
        "confirmPassword": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/auth/update-password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "password": "",
            "newPassword": "",
            "confirmPassword": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data.apiToken": ""
          }
