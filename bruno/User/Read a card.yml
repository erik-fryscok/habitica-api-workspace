info:
  name: Read a card
  type: http
  seq: 38
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/read-card/:cardType"
  params:
    - name: cardType
      value: ""
      type: path
      description: Type of card to read (e.g. - birthday, greeting, nye, thankyou, valentine).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/read-card/:cardType"
      method: POST
      params:
        - name: cardType
          value: ""
          type: path
          description: Type of card to read (e.g. - birthday, greeting, nye, thankyou, valentine).
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "specialItems": {
                "snowball": 0,
                "spookySparkles": 0,
                "shinySeed": 0,
                "seafoam": 0,
                "valentine": 0,
                "valentineReceived": [],
                "nye": 0,
                "nyeReceived": [],
                "greeting": 0,
                "greetingReceived": [
                  "MadPink"
                ],
                "thankyou": 0,
                "thankyouReceived": [],
                "birthday": 0,
                "birthdayReceived": []
              },
              "cardReceived": false
            },
            "message": "valentine has been read"
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/read-card/:cardType"
      method: POST
      params:
        - name: cardType
          value: ""
          type: path
          description: Type of card to read (e.g. - birthday, greeting, nye, thankyou, valentine).
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "CardType": {}
          }
