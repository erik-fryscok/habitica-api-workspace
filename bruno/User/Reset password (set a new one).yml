info:
  name: Reset password (set a new one)
  type: http
  seq: 5
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/auth/reset-password-set-new-one"
  body:
    type: json
    data: |-
      {
        "newPassword": "",
        "confirmPassword": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/auth/reset-password-set-new-one"
      method: POST
      body:
        type: json
        data: |-
          {
            "newPassword": "",
            "confirmPassword": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": ""
          }
