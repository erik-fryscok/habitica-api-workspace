info:
  name: Move a pinned item in the rewards column to a new position after being sorted
  type: http
  seq: 3
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/move-pinned-item/:type/:path/move/to/:position"
  params:
    - name: type
      value: ""
      type: path
      description: "Path parameter: type"
    - name: path
      value: ""
      type: path
      description: The unique item path used for pinning
    - name: position
      value: ""
      type: path
      description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/move-pinned-item/:type/:path/move/to/:position"
      method: POST
      params:
        - name: type
          value: ""
          type: path
          description: "Path parameter: type"
        - name: path
          value: ""
          type: path
          description: The unique item path used for pinning
        - name: position
          value: ""
          type: path
          description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "path": "quests.mayhemMistiflying3",
              "type": "quests",
              "_id": "5a32d357232feb3bc94c2bdf"
            },
            "notifications": []
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/user/move-pinned-item/:type/:path/move/to/:position"
      method: POST
      params:
        - name: type
          value: ""
          type: path
          description: "Path parameter: type"
        - name: path
          value: ""
          type: path
          description: The unique item path used for pinning
        - name: position
          value: ""
          type: path
          description: Where to move the task. 0 = top of the list ("push to top"). -1 = bottom of the list ("push to bottom").
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "TaskNotFound": {}
          }
