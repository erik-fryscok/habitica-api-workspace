info:
  name: Update the user
  type: http
  seq: 24
  tags:
    - User

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/user"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 401 Response
    description: "401"
    request:
      url: "{{baseUrl}}/api/v3/user"
      method: PUT
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageUserOperationProtected": {}
          }
