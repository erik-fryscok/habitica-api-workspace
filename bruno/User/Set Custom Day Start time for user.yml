info:
  name: Set Custom Day Start time for user.
  type: http
  seq: 53
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/custom-day-start"
  body:
    type: json
    data: |-
      {
        "dayStart": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/custom-day-start"
      method: POST
      body:
        type: json
        data: |-
          {
            "dayStart": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "message": "Your custom day start has changed."
            },
            "notifications": []
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/custom-day-start"
      method: POST
      body:
        type: json
        data: |-
          {
            "dayStart": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Validation": {}
          }
