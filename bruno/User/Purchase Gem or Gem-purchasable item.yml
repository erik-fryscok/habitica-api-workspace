info:
  name: Purchase Gem or Gem-purchasable item
  type: http
  seq: 36
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/purchase/:type/:key"
  params:
    - name: type
      value: gems
      type: path
      description: Type of item to purchase.
    - name: type
      value: eggs
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: hatchingPotions
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: premiumHatchingPotions
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: food
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: quests
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: gear
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: type
      value: pets
      type: path
      description: Type of item to purchase.
      disabled: true
    - name: key
      value: ""
      type: path
      description: Item's key (use "gem" for purchasing gems)
  body:
    type: json
    data: |-
      {
        "quantity": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

