info:
  name: Get the authenticated user's profile
  type: http
  seq: 23
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/api/v3/user"
  params:
    - name: userFields
      value: ""
      type: query
      description: A list of comma-separated user fields to be returned instead of the entire document. Notifications are always returned.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user"
      method: GET
      params:
        - name: userFields
          value: ""
          type: query
          description: A list of comma-separated user fields to be returned instead of the entire document. Notifications are always returned.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
            --  User data included here, for details of the user model see:
            --  https://github.com/HabitRPG/habitica/tree/develop/website/server/models/user
            }
