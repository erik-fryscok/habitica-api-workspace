info:
  name: Block / unblock a user from sending you a PM
  type: http
  seq: 1
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/block/:uuid"
  params:
    - name: uuid
      value: ""
      type: path
      description: The uuid of the user to block / unblock
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/block/:uuid"
      method: POST
      params:
        - name: uuid
          value: ""
          type: path
          description: The uuid of the user to block / unblock
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              "e4842579-g987-d2d2-8660-2f79e725fb79"
            ],
            "notifications": []
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/block/:uuid"
      method: POST
      params:
        - name: uuid
          value: ""
          type: path
          description: The uuid of the user to block / unblock
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "InvalidUUID": {}
          }
