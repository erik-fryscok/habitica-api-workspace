info:
  name: Allocate multiple Stat Points
  type: http
  seq: 11
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/allocate-bulk"
  body:
    type: json
    data: |-
      {
        "stats": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/allocate-bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "stats": {}
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/allocate-bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "stats": {}
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoPoints": {}
          }
