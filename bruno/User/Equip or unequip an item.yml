info:
  name: Equip or unequip an item
  type: http
  seq: 27
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/equip/:type/:key"
  params:
    - name: type
      value: mount
      type: path
      description: The type of item to equip or unequip.
    - name: type
      value: pet
      type: path
      description: The type of item to equip or unequip.
      disabled: true
    - name: type
      value: costume
      type: path
      description: The type of item to equip or unequip.
      disabled: true
    - name: type
      value: equipped
      type: path
      description: The type of item to equip or unequip.
      disabled: true
    - name: key
      value: ""
      type: path
      description: The item to equip or unequip
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/equip/:type/:key"
      method: POST
      params:
        - name: type
          value: mount
          type: path
          description: The type of item to equip or unequip.
        - name: type
          value: pet
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: type
          value: costume
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: type
          value: equipped
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: key
          value: ""
          type: path
          description: The item to equip or unequip
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {---DATA TRUNCATED---},
            "message": "Training Sword unequipped."
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/equip/:type/:key"
      method: POST
      params:
        - name: type
          value: mount
          type: path
          description: The type of item to equip or unequip.
        - name: type
          value: pet
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: type
          value: costume
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: type
          value: equipped
          type: path
          description: The type of item to equip or unequip.
          disabled: true
        - name: key
          value: ""
          type: path
          description: The item to equip or unequip
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "notOwned": {}
          }
