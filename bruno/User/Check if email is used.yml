info:
  name: Check if email is used
  type: http
  seq: 2
  tags:
    - User

http:
  method: PUT
  url: "{{baseUrl}}/api/v4/user/auth/check-email"
  body:
    type: json
    data: |-
      {
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v4/user/auth/check-email"
      method: PUT
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data.email": "",
            "data.valid": false
          }
