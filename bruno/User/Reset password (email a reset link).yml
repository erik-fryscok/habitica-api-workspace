info:
  name: Reset password (email a reset link)
  type: http
  seq: 4
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/reset-password"
  body:
    type: json
    data: |-
      {
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
