info:
  name: Hatch a pet
  type: http
  seq: 33
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/hatch/:egg/:hatchingPotion"
  params:
    - name: egg
      value: ""
      type: path
      description: The egg to use
    - name: hatchingPotion
      value: ""
      type: path
      description: The hatching potion to use
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/hatch/:egg/:hatchingPotion"
      method: POST
      params:
        - name: egg
          value: ""
          type: path
          description: The egg to use
        - name: hatchingPotion
          value: ""
          type: path
          description: The hatching potion to use
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {},
            "message": "Your egg hatched! Visit your stable to equip your pet."
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/hatch/:egg/:hatchingPotion"
      method: POST
      params:
        - name: egg
          value: ""
          type: path
          description: The egg to use
        - name: hatchingPotion
          value: ""
          type: path
          description: The hatching potion to use
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageAlreadyPet": {},
            "messageMissingEggPotion": {},
            "messageInvalidEggPotionCombo": {}
          }
