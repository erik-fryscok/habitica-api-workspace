info:
  name: Delete an authenticated user's account
  type: http
  seq: 22
  tags:
    - User

http:
  method: DELETE
  url: "{{baseUrl}}/api/v3/user"
  body:
    type: json
    data: |-
      {
        "password": "",
        "feedback": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "password": "",
            "feedback": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {}
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "password": "",
            "feedback": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "MissingPassword": {},
            "NotAuthorized": {},
            "BadRequest": {}
          }
