info:
  name: Unequip all items by type
  type: http
  seq: 48
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v4/user/unequip/:type"
  params:
    - name: type
      value: pet-mount-background
      type: path
      description: The type of items to unequip.
    - name: type
      value: costume
      type: path
      description: The type of items to unequip.
      disabled: true
    - name: type
      value: equipped
      type: path
      description: The type of items to unequip.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v4/user/unequip/:type"
