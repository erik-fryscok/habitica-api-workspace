          description: The type of items to unequip.
        - name: type
          value: costume
          type: path
          description: The type of items to unequip.
          disabled: true
        - name: type
          value: equipped
          type: path
          description: The type of items to unequip.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
