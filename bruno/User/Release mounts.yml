info:
  name: Release mounts
  type: http
  seq: 42
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/release-mounts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
