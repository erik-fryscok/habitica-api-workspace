info:
  name: Buy a health potion
  type: http
  seq: 17
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/buy-health-potion"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/buy-health-potion"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              ---DATA TRUNCATED---
            },
            "message": "Bought Health Potion"
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/user/buy-health-potion"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageNotEnoughGold": {},
            "messageHealthAlreadyMax": {}
          }
