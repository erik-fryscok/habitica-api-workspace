info:
  name: Buy an Enchanted Armoire item
  type: http
  seq: 14
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/buy-armoire"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/buy-armoire"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
           "success": true,
           "data": {
             ---DATA TRUNCATED---
             "armoire": {
               "type": "food",
               "dropKey": "Fish",
               "dropArticle": "a ",
               "dropText": "Fish"
             }
           },
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/user/buy-armoire"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageNotEnoughGold": {}
          }
