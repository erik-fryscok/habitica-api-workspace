info:
  name: Use Orb of Rebirth on user
  type: http
  seq: 39
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/rebirth"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/rebirth"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
            },
            "message": "You have been reborn!"
              {
                "type": "REBIRTH_ACHIEVEMENT",
                "data": {},
                "id": "424d69fa-3a6d-47db-96a4-6db42ed77a43"
              }
            ]
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/rebirth"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Gems": {}
          }
