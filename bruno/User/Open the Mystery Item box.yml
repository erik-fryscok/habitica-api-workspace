info:
  name: Open the Mystery Item box
  type: http
  seq: 35
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/open-mystery-item"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/open-mystery-item"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          { "success": true,
            "data": {
              "mystery": "201612",
              "value": 0,
              "type": "armor",
              "key": "armor_mystery_201612",
              "set": "mystery-201612",
              "klass": "mystery",
              "index": "201612",
              "str": 0,
              "int": 0,
              "per": 0,
              "con": 0
            },
            "message": "Mystery item opened."
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/open-mystery-item"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Empty": {}
          }
