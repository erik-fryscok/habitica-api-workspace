info:
  name: Sell a gold-sellable item owned by the user
  type: http
  seq: 46
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/sell/:type/:key"
  params:
    - name: type
      value: eggs
      type: path
      description: The type of item to sell.
    - name: type
      value: hatchingPotions
      type: path
      description: The type of item to sell.
      disabled: true
    - name: type
      value: food
      type: path
      description: The type of item to sell.
      disabled: true
    - name: key
      value: ""
      type: path
      description: The key of the item
    - name: amount
      value: ""
      type: query
      description: The amount to sell
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/sell/:type/:key"
      method: POST
      params:
        - name: type
          value: eggs
          type: path
          description: The type of item to sell.
        - name: type
          value: hatchingPotions
          type: path
          description: The type of item to sell.
          disabled: true
        - name: type
          value: food
          type: path
          description: The type of item to sell.
          disabled: true
        - name: key
          value: ""
          type: path
          description: The key of the item
        - name: amount
          value: ""
          type: query
          description: The amount to sell
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data.stats": {},
            "data.items": {}
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/sell/:type/:key"
      method: POST
      params:
        - name: type
          value: eggs
          type: path
          description: The type of item to sell.
        - name: type
          value: hatchingPotions
          type: path
          description: The type of item to sell.
          disabled: true
        - name: type
          value: food
          type: path
          description: The type of item to sell.
