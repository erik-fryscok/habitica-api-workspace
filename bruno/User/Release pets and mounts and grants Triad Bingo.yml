info:
  name: Release pets and mounts and grants Triad Bingo
  type: http
  seq: 41
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/release-both"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/release-both"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "achievements": {
                "ultimateGearSets": {},
                "challenges": [],
                "quests": {},
                "perfect": 0,
                "beastMaster": true,
                "beastMasterCount": 1,
                "mountMasterCount": 1,
                "triadBingoCount": 1,
                "mountMaster": true,
                "triadBingo": true
              },
              "items": {}
            },
            "message": "Mounts and pets released"
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/release-both"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Gems": {}
          }
