info:
  name: Unlock item or set of items by purchase
  type: http
  seq: 49
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/unlock"
  params:
    - name: path
      value: ""
      type: query
      description: Full path to unlock. See "content" API call for list of items.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/unlock"
      method: POST
      params:
        - name: path
          value: ""
          type: query
          description: Full path to unlock. See "content" API call for list of items.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {},
            "message": "Items have been unlocked"
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/unlock"
      method: POST
      params:
        - name: path
          value: ""
          type: query
          description: Full path to unlock. See "content" API call for list of items.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Path": {},
            "Gems": {},
            "Unlocked": {}
          }
