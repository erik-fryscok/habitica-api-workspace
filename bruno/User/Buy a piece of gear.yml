info:
  name: Buy a piece of gear
  type: http
  seq: 15
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/buy-gear/:key"
  params:
    - name: key
      value: ""
      type: path
      description: The item to buy
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/buy-gear/:key"
      method: POST
      params:
        - name: key
          value: ""
          type: path
          description: The item to buy
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              ---TRUNCATED USER RECORD---
            },
            "message": "Bought Wooden Shield"
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/user/buy-gear/:key"
      method: POST
      params:
        - name: key
          value: ""
          type: path
          description: The item to buy
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageNotEnoughGold": {},
            "messageAlreadyOwnGear": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/user/buy-gear/:key"
      method: POST
      params:
        - name: key
          value: ""
          type: path
          description: The item to buy
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messageNotFound": {}
          }
