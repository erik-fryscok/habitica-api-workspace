info:
  name: Feed a pet
  type: http
  seq: 28
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/feed/:pet/:food"
  params:
    - name: pet
      value: ""
      type: path
    - name: food
      value: ""
      type: path
    - name: amount
      value: ""
      type: query
      description: "The amount of food to feed. Note: Pet can eat 50 units. Preferred food offers 5 units per food, other food 2 units."
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/feed/:pet/:food"
      method: POST
      params:
        - name: pet
          value: ""
          type: path
        - name: food
          value: ""
          type: path
        - name: amount
          value: ""
          type: query
          description: "The amount of food to feed. Note: Pet can eat 50 units. Preferred food offers 5 units per food, other food 2 units."
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {"success":true,"data":10,"message":"Shade Armadillo
          really likes the Chocolate!","notifications":[]}
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/feed/:pet/:food"
      method: POST
      params:
        - name: pet
          value: ""
          type: path
        - name: food
          value: ""
          type: path
        - name: amount
          value: ""
          type: query
          description: "The amount of food to feed. Note: Pet can eat 50 units. Preferred food offers 5 units per food, other food 2 units."
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "PetNotOwned": {},
            "InvalidPet": {},
            "FoodNotOwned": {},
            "notEnoughFood": {},
            "tooMuchFood": {}
          }
