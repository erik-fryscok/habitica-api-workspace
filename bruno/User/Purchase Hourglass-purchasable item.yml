info:
  name: Purchase Hourglass-purchasable item
  type: http
  seq: 37
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v3/user/purchase-hourglass/:type/:key"
  params:
    - name: type
      value: pets
      type: path
      description: The type of item to purchase
    - name: type
      value: mounts
      type: path
      description: The type of item to purchase
      disabled: true
    - name: key
      value: ""
      type: path
      description: "Ex: {Phoenix-Base}. The key for the mount/pet"
  body:
    type: json
    data: |-
      {
        "quantity": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/user/purchase-hourglass/:type/:key"
      method: POST
      params:
        - name: type
          value: pets
          type: path
          description: The type of item to purchase
        - name: type
          value: mounts
          type: path
          description: The type of item to purchase
          disabled: true
        - name: key
          value: ""
          type: path
          description: "Ex: {Phoenix-Base}. The key for the mount/pet"
      body:
        type: json
        data: |-
          {
            "quantity": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data.items": {},
            "data.purchasedPlanConsecutive": {},
            "message": ""
          }
  - name: 400 Response
    description: Error 4xx
    request:
      url: "{{baseUrl}}/api/v3/user/purchase-hourglass/:type/:key"
      method: POST
      params:
        - name: type
          value: pets
          type: path
          description: The type of item to purchase
        - name: type
          value: mounts
          type: path
          description: The type of item to purchase
          disabled: true
        - name: key
          value: ""
          type: path
          description: "Ex: {Phoenix-Base}. The key for the mount/pet"
      body:
        type: json
        data: |-
          {
            "quantity": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NotAvailable": {},
            "Hourglasses": {},
            "Quantity": {},
            "Type": {}
          }
