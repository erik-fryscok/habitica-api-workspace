info:
  name: Validate a coupon code
  type: http
  seq: 4
  tags:
    - Coupon

http:
  method: POST
  url: "{{baseUrl}}/api/v3/coupons/validate/:code"
  params:
    - name: code
      value: ""
      type: path
      description: The coupon code to validate
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/coupons/validate/:code"
      method: POST
      params:
        - name: code
          value: ""
          type: path
          description: The coupon code to validate
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data.valid": false
          }
