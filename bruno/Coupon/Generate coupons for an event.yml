info:
  name: Generate coupons for an event
  type: http
  seq: 1
  tags:
    - Coupon

http:
  method: POST
  url: "{{baseUrl}}/api/v3/coupons/generate/:event"
  params:
    - name: event
      value: wondercon
      type: path
      description: The event for which the coupon should be generated
    - name: event
      value: google_6mo
      type: path
      description: The event for which the coupon should be generated
      disabled: true
    - name: count
      value: ""
      type: query
      description: The number of coupon codes to generate
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/coupons/generate/:event"
      method: POST
      params:
        - name: event
          value: wondercon
          type: path
          description: The event for which the coupon should be generated
        - name: event
          value: google_6mo
          type: path
          description: The event for which the coupon should be generated
          disabled: true
        - name: count
          value: ""
          type: query
          description: The number of coupon codes to generate
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {}
            ]
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/coupons/generate/:event"
      method: POST
      params:
        - name: event
          value: wondercon
          type: path
          description: The event for which the coupon should be generated
        - name: event
          value: google_6mo
          type: path
          description: The event for which the coupon should be generated
          disabled: true
        - name: count
          value: ""
          type: query
          description: The number of coupon codes to generate
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "CouponValidationError": {}
          }
