info:
  name: Update a news post
  type: http
  seq: 5
  tags:
    - News

http:
  method: PUT
  url: "{{baseUrl}}/api/v4/news/:postId"
  params:
    - name: postId
      value: ""
      type: path
      description: The posts _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v4/news/:postId"
      method: PUT
      params:
        - name: postId
          value: ""
          type: path
          description: The posts _id
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          HTTP/1.1 200 OK
          {
            "title": "News Title",
            ...
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v4/news/:postId"
      method: PUT
      params:
        - name: postId
          value: ""
          type: path
          description: The posts _id
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "postIdRequired": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v4/news/:postId"
      method: PUT
      params:
        - name: postId
          value: ""
          type: path
          description: The posts _id
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NewsPostNotFound": {}
          }
