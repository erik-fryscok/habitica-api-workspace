info:
  name: Get inbox messages for a user
  type: http
  seq: 1
  tags:
    - Inbox

http:
  method: GET
  url: "{{baseUrl}}/api/v3/inbox/messages"
  params:
    - name: page
      value: ""
      type: query
      description: Load the messages of the selected Page - 10 Messages per Page
    - name: conversation
      value: ""
      type: query
      description: Loads only the messages of a conversation
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/inbox/messages"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: Load the messages of the selected Page - 10 Messages per Page
        - name: conversation
          value: ""
          type: query
          description: Loads only the messages of a conversation
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {}
            ]
          }
