info:
  name: Like a group chat message
  type: http
  seq: 6
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId/like"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
    - name: chatId
      value: ""
      type: path
      description: The chat message _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

