info:
  name: Clear flags
  type: http
  seq: 1
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId/clearflags"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group id ('party' for the user party and 'habitrpg' for tavern are accepted)
    - name: chatId
      value: ""
      type: path
      description: The chat message id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId/clearflags"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group id ('party' for the user party and 'habitrpg' for tavern are accepted)
        - name: chatId
          value: ""
          type: path
          description: The chat message id
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
