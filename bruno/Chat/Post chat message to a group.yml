info:
  name: Post chat message to a group
  type: http
  seq: 5
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v3/groups/:groupId/chat"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
    - name: previousMsg
      value: ""
      type: query
      description: The previous chat message's UUID which will force a return of the full group chat.
  body:
    type: json
    data: |-
      {
        "message": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
        - name: previousMsg
          value: ""
          type: query
          description: The previous chat message's UUID which will force a return of the full group chat.
      body:
        type: json
        data: |-
          {
            "message": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "chatPriviledgesRevoked": {},
            "groupIdRequired": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat"
      method: POST
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted)
        - name: previousMsg
          value: ""
          type: query
          description: The previous chat message's UUID which will force a return of the full group chat.
      body:
        type: json
        data: |-
          {
            "message": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "GroupNotFound": {}
          }
