info:
  name: Delete chat message from a group
  type: http
  seq: 2
  tags:
    - Chat

http:
  method: DELETE
  url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
    - name: chatId
      value: ""
      type: path
      description: The chat message id
    - name: previousMsg
      value: ""
      type: query
      description: The last message's ID fetched by the client so that the whole chat will be returned only if new messages have been posted in the meantime.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId"
      method: DELETE
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
        - name: chatId
          value: ""
          type: path
          description: The chat message id
        - name: previousMsg
          value: ""
          type: query
          description: The last message's ID fetched by the client so that the whole chat will be returned only if new messages have been posted in the meantime.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": ""
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId"
      method: DELETE
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
        - name: chatId
          value: ""
          type: path
          description: The chat message id
        - name: previousMsg
          value: ""
          type: query
          description: The last message's ID fetched by the client so that the whole chat will be returned only if new messages have been posted in the meantime.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "onlyCreatorOrAdminCanDeleteChat": "",
            "groupIdRequired": {},
            "chatIdRequired": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/chat/:chatId"
      method: DELETE
      params:
        - name: groupId
          value: ""
          type: path
          description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
        - name: chatId
          value: ""
          type: path
          description: The chat message id
        - name: previousMsg
          value: ""
          type: query
          description: The last message's ID fetched by the client so that the whole chat will be returned only if new messages have been posted in the meantime.
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
