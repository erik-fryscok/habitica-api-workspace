info:
  name: Get chat messages from a group
  type: http
  seq: 4
  tags:
    - Chat

http:
  method: GET
  url: "{{baseUrl}}/api/v3/groups/:groupId/chat"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group _id ('party' for the user party and 'habitrpg' for tavern are accepted).
    - name: limit
      value: ""
      type: query
      description: The number of messages to fetch (max 400).
      disabled: true
    - name: before
      value: ""
      type: query
      description: Fetch messages older than this message ID.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

