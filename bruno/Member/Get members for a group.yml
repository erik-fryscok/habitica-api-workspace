        - name: includeAllPublicFields
          value: ""
          type: query
          description: If set to true then all public fields for members will be returned (similar to when making a request for a single member).
        - name: includeTasks
          value: ""
          type: query
          description: If set to true, then response should include all tasks per user related to the challenge
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "_id": "00000001-1111-9999-9000-111111111111",
                "profile": {
