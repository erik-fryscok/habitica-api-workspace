info:
  name: Get invites for a group
  type: http
  seq: 3
  tags:
    - Member

http:
  method: GET
  url: "{{baseUrl}}/api/v3/groups/:groupId/invites"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group id ('party' for the user party is accepted)
    - name: lastId
      value: ""
      type: query
      description: Query parameter to specify the last invite returned in a previous request to this route and get the next batch of results.
    - name: limit
      value: ""
      type: query
      description: BETA Query parameter to specify the number of results to return. Max is 60.
    - name: includeAllPublicFields
      value: ""
      type: query
      description: If set to true then all public fields for members will be returned (similar to when making a request for a single member).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/invites"
      method: GET
      params:
        - name: groupId
          value: ""
          type: path
          description: The group id ('party' for the user party is accepted)
        - name: lastId
          value: ""
          type: query
          description: Query parameter to specify the last invite returned in a previous request to this route and get the next batch of results.
        - name: limit
          value: ""
          type: query
          description: BETA Query parameter to specify the number of results to return. Max is 60.
        - name: includeAllPublicFields
          value: ""
          type: query
          description: If set to true then all public fields for members will be returned (similar to when making a request for a single member).
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "_id": "99f3cb9d-4af8-4ca4-9b82-6b2a6bf59b7a",
                "profile": {
                  "name": "DoomSmoocher"
                },
                "id": "99f3cb9d-4af8-4ca4-9b82-6b2a6bf59b7a"
              }
            ]
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/groups/:groupId/invites"
      method: GET
      params:
        - name: groupId
          value: ""
          type: path
          description: The group id ('party' for the user party is accepted)
        - name: lastId
          value: ""
