info:
  name: Send a gem gift to a member
  type: http
  seq: 11
  tags:
    - Member

http:
  method: POST
  url: "{{baseUrl}}/api/v3/members/transfer-gems"
  body:
    type: json
    data: |-
      {
        "message": "",
        "toUserId": "",
        "gemAmount": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/members/transfer-gems"
      method: POST
      body:
        type: json
        data: |-
          {
            "message": "",
            "toUserId": "",
            "gemAmount": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/members/transfer-gems"
      method: POST
      body:
        type: json
        data: |-
          {
            "message": "",
            "toUserId": "",
            "gemAmount": 0
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "UserNotFound": {}
          }
