info:
  name: Get a challenge member progress
  type: http
  seq: 2
  tags:
    - Member

http:
  method: GET
  url: "{{baseUrl}}/api/v3/challenges/:challengeId/members/:memberId"
  params:
    - name: challengeId
      value: ""
      type: path
      description: The challenge _id
    - name: memberId
      value: ""
      type: path
      description: The member _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

