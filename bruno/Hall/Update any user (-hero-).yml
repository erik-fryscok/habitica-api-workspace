info:
  name: Update any user ("hero")
  type: http
  seq: 2
  tags:
    - Hall

http:
  method: PUT
  url: "{{baseUrl}}/api/v3/hall/heroes/:heroId"
  params:
    - name: heroId
      value: ""
      type: path
      description: User ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/hall/heroes/:heroId"
      method: PUT
      params:
        - name: heroId
          value: ""
          type: path
          description: User ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {}
          }
  - name: 401 Response
    description: "401"
    request:
      url: "{{baseUrl}}/api/v3/hall/heroes/:heroId"
      method: PUT
      params:
        - name: heroId
          value: ""
          type: path
          description: User ID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoAuthHeaders": {},
            "NoAccount": {},
            "NotAdmin": {}
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/hall/heroes/:heroId"
      method: PUT
      params:
        - name: heroId
          value: ""
          type: path
          description: User ID
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
