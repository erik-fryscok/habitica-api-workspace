info:
  name: Get all Heroes (contributors)
  type: http
  seq: 4
  tags:
    - Hall

http:
  method: GET
  url: "{{baseUrl}}/api/v3/hall/heroes"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/hall/heroes"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "_id": "e6e01d2a-c2fa-4b9f-9c0f-7865b777e7b5",
                "profile": {
                  "name": "test2"
                },
                "contributor": {
                  "admin": false,
                  "level": 2,
                  "text": "Linguist"
                },
                "backer": {}
              }
            ]
          }
  - name: 401 Response
    description: "401"
    request:
      url: "{{baseUrl}}/api/v3/hall/heroes"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "NoAuthHeaders": {},
            "NoAccount": {}
          }
