info:
  name: Get a tag
  type: http
  seq: 4
  tags:
    - Tag

http:
  method: GET
  url: "{{baseUrl}}/api/v3/tags/:tagId"
  params:
    - name: tagId
      value: ""
      type: path
      description: The tag _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

