info:
  name: Reorder a tag
  type: http
  seq: 6
  tags:
    - Tag

http:
  method: POST
  url: "{{baseUrl}}/api/v3/reorder-tags"
  body:
    type: json
    data: |-
      {
        "tagId": "",
        "to": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/reorder-tags"
      method: POST
      body:
        type: json
        data: |-
          {
            "tagId": "",
            "to": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {},
            "notifications": []
          }
  - name: 404 Response
    description: "404"
    request:
      url: "{{baseUrl}}/api/v3/reorder-tags"
      method: POST
      body:
        type: json
        data: |-
          {
            "tagId": "",
            "to": 0
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "TagNotFound": {}
          }
