info:
  name: Get a user's tags
  type: http
  seq: 2
  tags:
    - Tag

http:
  method: GET
  url: "{{baseUrl}}/api/v3/tags"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/api/v3/tags"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "name": "Work",
                "id": "3d5d324d-a042-4d5f-872e-0553e228553e"
              },
              {
                "name": "apitester",
                "challenge": "true",
                "id": "f23c12f2-5830-4f15-9c36-e17fd729a812"
              },
              {
                "name": "practicetag",
                "id": "8bc0afbf-ab8e-49a4-982d-67a40557ed1a"
              }
            ],
            "notifications": []
