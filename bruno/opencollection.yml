opencollection: 1.0.0

info:
  name: Habitica API Workspace (unofficial)
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: x-api-user
      value: "{{userId}}"
    - name: x-api-key
      value: "{{apiKey}}"
    - name: x-client
      value: "{{userId}}-HabiticaApiWorkspace"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
