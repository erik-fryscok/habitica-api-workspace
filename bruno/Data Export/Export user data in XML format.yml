info:
  name: Export user data in XML format
  type: http
  seq: 2
  tags:
    - Data Export

http:
  method: GET
  url: "{{baseUrl}}/export/userdata.xml"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/export/userdata.xml"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          {
            "File": ""
          }
