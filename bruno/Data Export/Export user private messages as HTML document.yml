info:
  name: Export user private messages as HTML document
  type: http
  seq: 4
  tags:
    - Data Export

http:
  method: GET
  url: "{{baseUrl}}/export/inbox.html"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success 200
    request:
      url: "{{baseUrl}}/export/inbox.html"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "File": ""
          }
